[project]
name = "spiel"
version = "0.1.0"
description = "Die Wortqueste – a browser platformer for learning German (B1)"
readme = "README.md"
authors = [
    { name = "magdalee", email = "magkalita@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
]

[project.scripts]
spiel = "spiel:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
